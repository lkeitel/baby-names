<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Name Picker</title>
<style>
  :root {
    --bg: #fff7f2; --card: #ffffff; --ink: #3a2f3f; --muted: #8b7f90;
    --pink: #ff6b8b; --pink-soft: #ffe1e8; --mint: #38b79a; --mint-soft: #d9f4ec;
    --line: #f0e3e0; --accent: var(--pink); --accent-soft: var(--pink-soft); --shadow: 0 12px 32px rgba(120, 70, 90, .15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1720; --card: #2a2230; --ink: #f6ecf3; --muted: #a698ad;
      --pink-soft: #4a2a37; --mint-soft: #203b35; --line: #3a3042; --shadow: 0 12px 32px rgba(0,0,0,.4);
    }
  }
  html[data-p="1"] { --accent: var(--mint); --accent-soft: var(--mint-soft); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 20% 0%, var(--accent-soft), transparent 55%), var(--bg);
    color: var(--ink); font: 16px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 480px; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  h1 { font-size: 1.25rem; margin: 4px 0 0; text-align: center; letter-spacing: .2px; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .player {
    border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px;
    padding: 8px 10px; font: inherit; cursor: pointer; text-align: left; position: relative;
  }
  .player.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .player.active small { color: var(--accent); font-weight: 700; }
  .player b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 22px; }
  .player small { color: var(--muted); }
  .player .edit { position: absolute; right: 8px; top: 8px; font-size: .85rem; opacity: .6; }
  nav { display: flex; background: var(--card); border-radius: 14px; padding: 4px; border: 1px solid var(--line); }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 8px; border-radius: 10px; cursor: pointer; }
  nav button.on { background: var(--accent); color: #fff; }
  nav .count { font-weight: 700; }
  .filters { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .88rem; cursor: pointer; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .stage { position: relative; height: 340px; margin: 4px 0; touch-action: pan-y; user-select: none; }
  .card {
    position: absolute; inset: 0; background: var(--card); border-radius: 28px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px;
    cursor: grab; will-change: transform;
  }
  .card.back { transform: scale(.95) translateY(12px); opacity: .6; z-index: 0; cursor: default; }
  .card.front { z-index: 1; }
  .card .name { font-size: clamp(2.4rem, 12vw, 3.4rem); font-weight: 800; text-align: center; word-break: break-word; line-height: 1.05; }
  .tag { font-size: .8rem; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .tag.g { background: var(--pink-soft); color: var(--pink); }
  .tag.b { background: var(--mint-soft); color: var(--mint); }
  .tag.n { background: #fff0c9; color: #b8860b; }
  .tag.c { background: #e8e1ff; color: #7a5cff; }
  .card a { color: var(--muted); font-size: .85rem; }
  .stamp { position: absolute; top: 22px; font-weight: 900; font-size: 1.6rem; border: 4px solid; border-radius: 12px; padding: 2px 12px; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
  .stamp.like { left: 22px; color: var(--mint); }
  .stamp.nope { right: 22px; color: var(--pink); transform: rotate(12deg); }
  .actions { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .round { width: 68px; height: 68px; border-radius: 50%; border: 0; font-size: 1.9rem; background: var(--card); box-shadow: var(--shadow); cursor: pointer; transition: transform .1s; }
  .round:active { transform: scale(.92); }
  .round.small { width: 46px; height: 46px; font-size: 1.1rem; color: var(--muted); }
  .round:disabled { opacity: .4; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: .85rem; margin: 0; }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
  .empty .big { font-size: 2.6rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 1rem; }
  ul.matches { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.matches li { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 1.3rem; font-weight: 700; }
  ul.matches li.fav { border-color: #f5b301; background: #fff8e1; color: #3a2f3f; }
  ul.matches button { border: 0; background: none; font-size: 1.4rem; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips .chip { font-size: .85rem; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; }
  .btn { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  label.toggle { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .88rem; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; transition: .25s; pointer-events: none; z-index: 10; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .burst { position: fixed; pointer-events: none; font-size: 1.6rem; z-index: 9; animation: pop 1s ease-out forwards; }
  @keyframes pop { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); } }
  .turn { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: 16px; padding: 10px 14px; }
  .turn .who { font-size: 1.15rem; font-weight: 800; color: var(--accent); }
  .turn small { display: block; color: var(--muted); font-weight: 600; }
  #setup { position: fixed; inset: 0; background: rgba(30, 20, 35, .55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  #setup .modal { background: var(--card); border-radius: 24px; padding: 22px; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
  .stack { display: grid; gap: 12px; }
  .code { font: 800 1.4rem ui-monospace, Menlo, monospace; letter-spacing: 1px; text-align: center; padding: 10px; background: var(--accent-soft); border-radius: 12px; user-select: all; }
  #setup h2 { margin: 0; text-align: center; }
  #setup label { font-weight: 700; font-size: .9rem; display: grid; gap: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <h1>🍼 Little Name Picker</h1>
  <div class="players" id="players"></div>
  <nav id="tabs">
    <button data-tab="swipe" class="on">Swipe</button>
    <button data-tab="matches">Matches <span class="count" id="matchCount"></span></button>
    <button data-tab="lists">Lists</button>
  </nav>

  <section id="swipe">
    <div class="turn" id="turn"></div>
    <div class="filters" id="filters"></div>
    <div class="stage" id="stage"></div>
    <div class="actions">
      <button class="round small" id="undo" title="Undo (Z)">↺</button>
      <button class="round" id="pass" title="Pass (←)">✕</button>
      <button class="round" id="like" title="Love it (→)">💗</button>
    </div>
    <p class="hint" id="remaining"></p>
    <div class="panel">
      <h2>Got a name in mind?</h2>
      <form class="row" id="addForm">
        <input type="text" id="addName" placeholder="Add your own name" maxlength="30" autocomplete="off">
        <button class="btn">Add</button>
      </form>
    </div>
  </section>

  <section id="matches" class="hidden"></section>

  <section id="lists" class="hidden">
    <div class="panel" id="listsBody"></div>
    <div class="panel" style="margin-top:14px">
      <h2>Each on your own phone</h2>
      <div id="roomBox"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="reset">Start over</button>
      </div>
      <label class="toggle" style="margin-top:12px"><input type="checkbox" id="reveal"> Announce matches while swiping</label>
    </div>
  </section>
</div>
<div id="setup" class="hidden">
  <div class="modal">
    <div id="setupChoose" class="stack">
      <h2>👋 Let's pick a name!</h2>
      <button class="btn" id="chooseRoom">📱 Each on our own phone</button>
      <button class="btn ghost" id="chooseLocal">🤝 Sharing one phone</button>
    </div>
    <form id="roomForm" class="stack hidden">
      <h2>📱 Your own phones</h2>
      <label>Your name <input type="text" id="roomName" maxlength="20" autocomplete="off"></label>
      <button class="btn" id="createBtn">Create a new room</button>
      <p class="hint">or join your partner's room</p>
      <label>Room code <input type="text" id="roomCode" maxlength="40" autocomplete="off" autocapitalize="off" placeholder="abcd-efgh-jkmn"></label>
      <button class="btn ghost" type="button" id="joinBtn">Join room</button>
      <button class="btn ghost" type="button" id="roomBack">Back</button>
    </form>
    <form id="setupForm" class="stack hidden">
      <h2>🤝 Who's picking?</h2>
      <label>Your name <input type="text" id="setupMe" maxlength="20" required autocomplete="off"></label>
      <label>Your partner's name <input type="text" id="setupPartner" maxlength="20" required autocomplete="off"></label>
      <button class="btn">Let's go</button>
      <button class="btn ghost" type="button" id="localBack">Back</button>
    </form>
  </div>
</div>
<div id="toast"></div>

<script>
// ---------- names ----------
const RAW = {
  n: "Avery Riley Quinn Rowan Wren Kai Logan Harper Ellis Cameron Charlie Sage River Phoenix Emerson Finley Hayden Harley Lennon Morgan Parker Reese Remy Robin Rory Sasha Skyler Taylor Teddy Blake Dakota Frankie Indigo Jules Kit Marlow Oakley Arden Ash Bailey Briar Cass Devon Gray Lane London Max Noel Reed Tatum Val Rue Emery Sloane Sutton Peyton Kendall Darcy Lake Winter Alden Ainsley Aspen Brook Campbell Hollis Linden Marley Merritt Sterling Wilder Lennox Rio",
  b: "Liam Oliver William Henry Theodore Sebastian Alexander Owen Leo Jackson Mason Hudson Aiden Julian Grayson Wyatt Maverick Dylan Anthony Lincoln Charles Miles Hunter Nolan Adrian Declan Ryan Cooper August Weston Finn Felix Atticus Beau Milo Walter Arthur Hugo Oscar Louis Otis Rhys Callum Jasper Everett Graham Hayes Ronan Theo Soren Emmett Rhett Bodhi Sullivan Colin Dominic Edwin Frederick Harrison Knox Landon Malcolm Nico Orion Roman Sawyer Victor Xavier Zane Cormac Desmond Leopold Percy Weston Ansel Bennett Brooks Cassius Cyrus Dashiell Easton Elio Hendrix Kingston Magnus Maxwell Nash Pierce Reid Rocco Stellan Zander Archer Briggs Calvin Clive Dexter Flynn Gus Heath Jett Keaton Lachlan Monroe Wesley Tristan Rupert Vincent Lawrence Ambrose Conrad Anders"
};
const NAMES = []; const seen = new Set();
for (const cat of ["n", "b"]) for (const n of RAW[cat].split(" ")) {
  if (!seen.has(n)) { seen.add(n); NAMES.push({ name: n, cat }); }
}

// ---------- state ----------
const KEY = "babynames-v1";
const fresh = () => ({
  players: [{ name: "Me", liked: [], passed: [] }, { name: "Partner", liked: [], passed: [] }],
  active: 0, custom: [], stars: [], filter: "all", reveal: true, setup: false, room: null, slot: 0
});
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY))); } catch { S = fresh(); }
if (S.filter === "g") S.filter = "all";
{ // drop picks that are no longer in the name list (e.g. removed girl/biblical names)
  const known = new Set([...NAMES.map(x => x.name), ...S.custom]);
  S.players.forEach(p => { p.liked = p.liked.filter(n => known.has(n)); p.passed = p.passed.filter(n => known.has(n)); });
  S.stars = S.stars.filter(n => known.has(n));
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const save = () => { persist(); schedulePush(); };

let tab = "swipe", deck = [], history = [];
const $ = id => document.getElementById(id);
const me = () => S.players[S.active];
const other = () => S.players[1 - S.active];
const pool = () => NAMES.concat(S.custom.map(name => ({ name, cat: "c" })));
const matches = () => S.players[0].liked.filter(n => S.players[1].liked.includes(n));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function buildDeck() {
  const done = new Set([...me().liked, ...me().passed]);
  const items = pool().filter(x => !done.has(x.name) && (S.filter === "all" || x.cat === S.filter || x.cat === "c"));
  deck = shuffle(items);
  history = [];
}

// ---------- rendering ----------
function renderPlayers() {
  $("players").innerHTML = "";
  S.players.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "player" + (i === S.active ? " active" : "");
    b.innerHTML = "<b></b><small></small><span class='edit'>✎</span>";
    b.querySelector("b").textContent = p.name;
    b.querySelector("small").textContent = (S.room ? (i === S.slot ? "you · " : "partner · ") : (i === S.active ? "swiping now · " : "tap to switch · ")) + p.liked.length + " loved";
    if (S.room && i !== S.slot) b.querySelector(".edit").remove();
    b.onclick = e => {
      if (S.room && i !== S.slot) return;
      if (e.target.classList.contains("edit")) {
        const v = prompt("Name for this player:", p.name);
        if (v && v.trim()) { p.name = v.trim().slice(0, 20); save(); render(); }
      } else if (i !== S.active && !S.room) { S.active = i; buildDeck(); render(); }
    };
    $("players").appendChild(b);
  });
}

function renderFilters() {
  const opts = [["all", "All"], ["b", "Boy"], ["n", "Neutral"]];
  $("filters").innerHTML = "";
  for (const [k, label] of opts) {
    const b = document.createElement("button");
    b.className = "chip" + (S.filter === k ? " on" : "");
    b.textContent = label;
    b.onclick = () => { S.filter = k; save(); buildDeck(); render(); };
    $("filters").appendChild(b);
  }
}

const TAGS = { b: "Boy", n: "Neutral", c: "Yours" };
function cardEl(item, front) {
  const c = document.createElement("div");
  c.className = "card " + (front ? "front" : "back");
  c.innerHTML = "<span class='stamp like'>LOVE</span><span class='stamp nope'>NOPE</span><div class='name'></div><span class='tag'></span>";
  c.querySelector(".name").textContent = item.name;
  const t = c.querySelector(".tag"); t.className = "tag " + item.cat; t.textContent = TAGS[item.cat];
  if (front) {
    const a = document.createElement("a");
    a.href = "https://www.behindthename.com/name/" + encodeURIComponent(item.name.toLowerCase());
    a.target = "_blank"; a.rel = "noopener"; a.textContent = "meaning & origin ↗";
    a.addEventListener("pointerdown", e => e.stopPropagation());
    c.appendChild(a);
  }
  return c;
}

function renderStage() {
  const st = $("stage"); st.innerHTML = "";
  const has = deck.length > 0;
  $("like").disabled = $("pass").disabled = !has;
  $("undo").disabled = history.length === 0;
  if (!has) {
    st.innerHTML = "<div class='empty'><div class='big'>🎉</div><p>You've seen every name here!<br>Try another filter, add your own, or hand the phone over.</p></div>";
  } else {
    if (deck[1]) st.appendChild(cardEl(deck[1], false));
    const f = cardEl(deck[0], true); st.appendChild(f); attachDrag(f);
  }
  $("remaining").textContent = has ? `${deck.length} name${deck.length === 1 ? "" : "s"} left for ${me().name}` : "";
}

function renderMatches() {
  const m = matches().sort((a, b) => S.stars.includes(b) - S.stars.includes(a));
  const el = $("matches");
  if (!m.length) {
    el.innerHTML = "<div class='empty'><div class='big'>💞</div><p>No matches yet.<br>Names you both love will show up here.</p></div>";
    return;
  }
  el.innerHTML = "<p class='hint' style='margin-bottom:10px'>Tap the star to mark your top picks.</p><ul class='matches'></ul>";
  const ul = el.querySelector("ul");
  for (const n of m) {
    const li = document.createElement("li");
    const fav = S.stars.includes(n);
    if (fav) li.className = "fav";
    const s = document.createElement("span"); s.textContent = n;
    const b = document.createElement("button"); b.textContent = fav ? "⭐" : "☆";
    b.onclick = () => { S.stars = fav ? S.stars.filter(x => x !== n) : [...S.stars, n]; sharedDirty = true; save(); renderMatches(); };
    li.append(s, b); ul.appendChild(li);
  }
}

function renderLists() {
  renderRoomBox();
  const body = $("listsBody"); body.innerHTML = "";
  S.players.forEach((p, i) => {
    const h = document.createElement("h2"); h.textContent = `${p.name}'s picks (${p.liked.length})`;
    const box = document.createElement("div"); box.className = "chips"; box.style.marginBottom = i === 0 ? "16px" : "0";
    if (!p.liked.length) { box.innerHTML = "<span class='hint'>Nothing yet</span>"; }
    for (const n of p.liked) {
      const c = document.createElement("button"); c.className = "chip"; c.textContent = n + " ✕"; c.title = "Remove";
      c.onclick = () => { p.liked = p.liked.filter(x => x !== n); S.stars = S.stars.filter(x => x !== n); sharedDirty = true; save(); buildDeck(); render(); };
      box.appendChild(c);
    }
    body.append(h, box);
  });
  $("reveal").checked = S.reveal;
}

function renderTurn() {
  const t = $("turn"); t.innerHTML = "";
  const l = document.createElement("div");
  const who = document.createElement("span"); who.className = "who"; who.textContent = me().name;
  const sm = document.createElement("small"); sm.textContent = "Swiping as";
  l.append(sm, who);
  const b = document.createElement("button"); b.className = "btn ghost"; b.textContent = "I'm " + other().name;
  b.onclick = () => { S.active = 1 - S.active; save(); buildDeck(); render(); };
  if (S.room) { const m = document.createElement("small"); m.id = "sync"; m.textContent = syncText(); t.append(l, m); }
  else t.append(l, b);
}

function render() {
  document.documentElement.dataset.p = S.active;
  renderTurn(); renderPlayers(); renderFilters(); renderStage(); renderMatches(); renderLists();
  const n = matches().length;
  $("matchCount").textContent = n ? `(${n})` : "";
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  for (const id of ["swipe", "matches", "lists"]) $(id).classList.toggle("hidden", id !== tab);
}

// ---------- actions ----------
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}
function burst() {
  const emojis = ["💗", "✨", "🍼", "🧸", "💞", "🌟"];
  for (let i = 0; i < 14; i++) {
    const e = document.createElement("div"); e.className = "burst";
    e.textContent = emojis[i % emojis.length];
    e.style.left = "50%"; e.style.top = "40%";
    e.style.setProperty("--dx", (Math.random() * 300 - 150) + "px");
    e.style.setProperty("--dy", (Math.random() * -260 - 20) + "px");
    document.body.appendChild(e); setTimeout(() => e.remove(), 1000);
  }
}

function decide(like) {
  if (!deck.length) return;
  const item = deck.shift();
  const list = like ? me().liked : me().passed;
  list.push(item.name);
  history.push({ item, like });
  if (like && S.reveal && other().liked.includes(item.name)) {
    toast(`It's a match: ${item.name}! 💞`); burst();
  }
  save(); render();
}

function undo() {
  const h = history.pop(); if (!h) return;
  const list = h.like ? me().liked : me().passed;
  const i = list.lastIndexOf(h.item.name); if (i > -1) list.splice(i, 1);
  deck.unshift(h.item); save(); render();
}

function attachDrag(card) {
  let sx = 0, dx = 0, dragging = false;
  const likeS = card.querySelector(".stamp.like"), nopeS = card.querySelector(".stamp.nope");
  card.addEventListener("pointerdown", e => { dragging = true; sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (!dragging) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    likeS.style.opacity = Math.min(Math.max(dx / 100, 0), 1);
    nopeS.style.opacity = Math.min(Math.max(-dx / 100, 0), 1);
  });
  const end = () => {
    if (!dragging) return; dragging = false;
    if (Math.abs(dx) > 100) {
      const dir = dx > 0 ? 1 : -1;
      card.style.transition = "transform .25s, opacity .25s";
      card.style.transform = `translateX(${dir * 500}px) rotate(${dir * 25}deg)`; card.style.opacity = 0;
      setTimeout(() => decide(dir > 0), 200);
    } else {
      card.style.transition = "transform .2s"; card.style.transform = "";
      likeS.style.opacity = nopeS.style.opacity = 0;
    }
    dx = 0;
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

// ---------- wiring ----------
$("like").onclick = () => decide(true);
$("pass").onclick = () => decide(false);
$("undo").onclick = undo;
document.addEventListener("keydown", e => {
  if (tab !== "swipe" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") decide(true);
  else if (e.key === "ArrowLeft") decide(false);
  else if (e.key.toLowerCase() === "z") undo();
});
$("tabs").onclick = e => { const t = e.target.closest("button"); if (t) { tab = t.dataset.tab; render(); } };
$("addForm").onsubmit = e => {
  e.preventDefault();
  const v = $("addName").value.trim().replace(/\s+/g, " ");
  if (!v) return;
  const name = v[0].toUpperCase() + v.slice(1);
  if (pool().some(x => x.name.toLowerCase() === name.toLowerCase())) { toast("Already in the list!"); return; }
  S.custom.push(name); sharedDirty = true; S.players.forEach(p => { p.passed = p.passed.filter(x => x !== name); });
  $("addName").value = ""; save(); buildDeck(); deck.unshift({ name, cat: "c" }); render(); toast(`Added ${name}`);
};
$("reveal").onchange = e => { S.reveal = e.target.checked; save(); };
$("reset").onclick = () => {
  if (!confirm("Clear all picks, matches and custom names?")) return;
  const keep = { room: S.room, slot: S.slot, active: S.active, setup: S.setup, reveal: S.reveal };
  const names = S.players.map(p => p.name); S = Object.assign(fresh(), keep); S.players.forEach((p, i) => p.name = names[i]);
  sharedDirty = true; save(); buildDeck(); render();
};
// ---------- live sync (AWS Lambda + DynamoDB) ----------
const API_URL = "https://zhx3scqo6acvcx5lgjm6c4ulyq0zcwrh.lambda-url.us-east-2.on.aws/";
const ROOM_RE = /^[a-z0-9-]{8,40}$/;
let sharedDirty = false, dirtyVer = 0, pushedVer = 0, pushTimer = null, online = true, polling = false;

const api = body => fetch(API_URL, { method: "POST", headers: { "content-type": "text/plain" }, body: JSON.stringify(body) })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const syncText = () => online ? "● live" : "○ reconnecting…";
function setOnline(v) {
  online = v; const el = $("sync"); if (el) el.textContent = syncText();
}

function schedulePush() {
  if (!S.room) return;
  dirtyVer++; clearTimeout(pushTimer); pushTimer = setTimeout(push, 300);
}
async function push() {
  if (!S.room) return;
  const v = dirtyVer, p = me(), sd = sharedDirty; sharedDirty = false;
  const body = { action: "put", room: S.room, slot: S.slot, name: p.name, liked: p.liked };
  if (sd) { body.custom = S.custom; body.stars = S.stars; }
  try { await api(body); pushedVer = v; setOnline(true); }
  catch { sharedDirty = sharedDirty || sd; setOnline(false); clearTimeout(pushTimer); pushTimer = setTimeout(push, 3000); }
}

function renderLight() {
  renderPlayers(); renderTurn(); renderMatches(); renderLists();
  const n = matches().length; $("matchCount").textContent = n ? `(${n})` : "";
}

function applyRemote(d) {
  const before = new Set(matches());
  let changed = false;
  const o = d.players[1 - S.slot], op = S.players[1 - S.slot];
  if (o && (op.name !== o.name || JSON.stringify(op.liked) !== JSON.stringify(o.liked))) { op.name = o.name; op.liked = o.liked; changed = true; }
  const fresh_ = (d.custom || []).filter(c => !S.custom.includes(c));
  if (fresh_.length) {
    for (const c of fresh_) {
      S.custom.push(c);
      if (!me().liked.includes(c) && !me().passed.includes(c)) deck.splice(Math.floor(Math.random() * Math.min(deck.length + 1, 6)), 0, { name: c, cat: "c" });
    }
    changed = true;
  }
  if (!sharedDirty && JSON.stringify(d.stars || []) !== JSON.stringify(S.stars)) { S.stars = d.stars || []; changed = true; }
  if (!changed) return;
  persist(); renderLight();
  if (S.reveal) for (const n of matches()) if (!before.has(n)) { toast(`It's a match: ${n}! 💞`); burst(); break; }
}

async function poll() {
  if (!S.room || polling || document.hidden || dirtyVer !== pushedVer) return;
  polling = true;
  try { applyRemote(await api({ action: "get", room: S.room })); setOnline(true); }
  catch { setOnline(false); }
  polling = false;
}
setInterval(poll, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// ---------- rooms ----------
const ROOM_CHARS = "abcdefghjkmnpqrstuvwxyz23456789";
function newCode() {
  const a = new Uint32Array(12); crypto.getRandomValues(a);
  const c = [...a].map(x => ROOM_CHARS[x % ROOM_CHARS.length]).join("");
  return c.slice(0, 4) + "-" + c.slice(4, 8) + "-" + c.slice(8);
}
const cleanCode = v => v.trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
const inviteUrl = () => location.href.split("#")[0] + "#room=" + S.room;

function renderRoomBox() {
  const box = $("roomBox"); box.innerHTML = "";
  if (!S.room) {
    box.innerHTML = "<p class='hint' style='text-align:left;margin:0 0 10px'>Create a room and your picks sync live between your phones, with nothing to send back and forth.</p>";
    const b = document.createElement("button"); b.className = "btn"; b.textContent = "Create or join a room";
    b.onclick = () => openSetup("roomForm"); box.appendChild(b);
    return;
  }
  const c = document.createElement("div"); c.className = "code"; c.textContent = S.room;
  const h = document.createElement("p"); h.className = "hint"; h.style.cssText = "text-align:left;margin:8px 0 10px";
  h.textContent = "Send your partner this link (or the code). Opening it on their phone joins this room.";
  const row = document.createElement("div"); row.className = "row";
  const cp = document.createElement("button"); cp.className = "btn"; cp.textContent = "Copy invite link";
  cp.onclick = async () => { try { await navigator.clipboard.writeText(inviteUrl()); toast("Invite link copied!"); } catch { prompt("Copy this link:", inviteUrl()); } };
  const lv = document.createElement("button"); lv.className = "btn ghost"; lv.textContent = "Leave room";
  lv.onclick = () => {
    if (!confirm("Leave this room? Your picks stay on this phone but stop syncing.")) return;
    S.room = null; S.slot = 0; S.active = 0; persist(); buildDeck(); render();
  };
  row.append(cp, lv); box.append(c, h, row);
}

function showSetup(view) {
  $("setup").classList.remove("hidden");
  for (const id of ["setupChoose", "roomForm", "setupForm"]) $(id).classList.toggle("hidden", id !== view);
  const f = { roomForm: "roomName", setupForm: "setupMe" }[view]; if (f) $(f).focus();
}
function openSetup(view = "setupChoose") {
  const mine = S.players[S.active].name;
  $("setupMe").value = S.players[0].name === "Me" ? "" : S.players[0].name;
  $("setupPartner").value = S.players[1].name === "Partner" ? "" : S.players[1].name;
  $("roomName").value = ["Me", "Partner"].includes(mine) ? "" : mine;
  showSetup(view);
}
$("chooseRoom").onclick = () => showSetup("roomForm");
$("chooseLocal").onclick = () => showSetup("setupForm");
$("roomBack").onclick = $("localBack").onclick = () => showSetup("setupChoose");

$("setupForm").onsubmit = e => {
  e.preventDefault();
  S.room = null; S.slot = 0; S.active = 0;
  S.players[0].name = $("setupMe").value.trim().slice(0, 20);
  S.players[1].name = $("setupPartner").value.trim().slice(0, 20);
  S.setup = true; persist(); $("setup").classList.add("hidden"); buildDeck(); render();
};

async function enterRoom(code, slot) {
  const name = $("roomName").value.trim().slice(0, 20);
  if (!name) { toast("Enter your name first"); $("roomName").focus(); return; }
  if (slot === 1) {
    try {
      const d = await api({ action: "get", room: code });
      if (!d.players["0"]) { toast("Couldn't find that room"); return; }
    } catch { toast("Can't reach the server"); return; }
  }
  const mine = S.players[S.active];
  const keepCustom = slot === 0;
  S.players = [null, null];
  S.players[slot] = { name, liked: mine.liked.slice(), passed: mine.passed.slice() };
  S.players[1 - slot] = { name: "Partner", liked: [], passed: [] };
  if (!keepCustom) { S.custom = []; S.stars = []; }
  S.room = code; S.slot = slot; S.active = slot; S.setup = true;
  sharedDirty = slot === 0; polling = false;
  try { window.history.replaceState(null, "", location.pathname + location.search); } catch {}
  $("setup").classList.add("hidden");
  buildDeck();
  if (slot === 1) { try { applyRemote(await api({ action: "get", room: code })); } catch {} }
  tab = slot === 0 ? "lists" : "swipe";
  save(); render();
  toast(slot === 0 ? "Room created! Send your partner the invite." : "Joined the room!");
}
$("roomForm").onsubmit = e => { e.preventDefault(); enterRoom(newCode(), 0); };
$("joinBtn").onclick = () => {
  const code = cleanCode($("roomCode").value);
  if (!ROOM_RE.test(code)) { toast("Check the room code"); return; }
  enterRoom(code, 1);
};

// ---------- stay up to date ----------
// GitHub Pages caches the HTML for ~10 minutes. Ask the server for the real Last-Modified
// and, if the loaded copy is older, reload through a fresh URL that bypasses every cache.
async function checkForUpdate() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const latest = Date.parse(r.headers.get("last-modified") || "");
    const loaded = Date.parse(document.lastModified);
    if (!latest || !loaded || latest <= loaded + 1000) return;
    if (location.search.includes("v=" + latest)) return; // already tried this version
    location.replace(location.pathname + "?v=" + latest + location.hash);
  } catch {}
}
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });

buildDeck(); render();
{
  const m = location.hash.match(/^#room=([a-z0-9-]{8,40})$/);
  if (m && S.room !== m[1]) { openSetup("roomForm"); $("roomCode").value = m[1]; $("roomName").focus(); }
  else if (!S.setup) openSetup();
}
</script>
